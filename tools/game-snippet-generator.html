<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool: Tạo snippet thêm game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 24px;
      background: #1c1e2c;
      color: #e0e0e0;
      border-radius: 12px;
    }
    h1 { color: #55bbab; font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin-bottom: 6px; color: #8a93a7; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #292e4a;
      border-radius: 8px;
      background: #23263a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #55bbab;
    }
    button {
      background: #55bbab;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover { background: #476cbc; }
    button.secondary { background: #292e4a; }
    button.secondary:hover { background: #323a5c; }
    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #292e4a;
      border-radius: 8px;
      background: #23263a;
      color: #c7d7e7;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      resize: vertical;
    }
    .hint {
      font-size: 0.85rem;
      color: #8a93a7;
      margin-top: 4px;
    }
    .actions { margin-top: 16px; }
  </style>
<link rel="canonical" href="https://monkeymart.one/tools/game-snippet-generator.html">
<meta name="description" content="Play game snippet generator on Monkey Mart. Enjoy this free browser game online with no download required.">
</head>
<body>
  <h1>Công cụ tạo snippet thêm game</h1>
  <p style="color: #8a93a7; font-size: 0.95rem;">Điền thông tin bên dưới, sau đó copy đoạn HTML và dán vào <code>index.html</code> (trong <code>&lt;section class="games-grid"&gt;</code>).</p>

  <label for="slug">Slug (tên file không dấu, dùng gạch ngang)</label>
  <input id="slug" type="text" placeholder="vd: super-mario, traffic-jam-3d" autocomplete="off">
  <p class="hint">Dùng cho: tên file ảnh, tên file trang game (vd: super-mario.html). Chỉ a-z, 0-9, dấu -.</p>

  <label for="name">Tên hiển thị</label>
  <input id="name" type="text" placeholder="vd: Super Mario" autocomplete="off">
  <p class="hint">Tên game hiển thị dưới ảnh trên trang chủ.</p>

  <label for="ext">Đuôi file ảnh</label>
  <input id="ext" type="text" value=".png" placeholder=".png hoặc .jpg" autocomplete="off" maxlength="5">

  <div class="actions">
    <button type="button" id="btnGenerate">Tạo snippet</button>
    <button type="button" id="btnCopy" class="secondary">Copy vào clipboard</button>
  </div>

  <label for="output">Kết quả (dán vào index.html)</label>
  <textarea id="output" readonly placeholder="Nhấn 'Tạo snippet' để tạo đoạn HTML..."></textarea>

  <script>
    var slugEl = document.getElementById('slug');
    var nameEl = document.getElementById('name');
    var extEl = document.getElementById('ext');
    var outputEl = document.getElementById('output');
    var btnGenerate = document.getElementById('btnGenerate');
    var btnCopy = document.getElementById('btnCopy');

    function slugify(s) {
      return String(s)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '');
    }

    function generate() {
      var slug = slugify(slugEl.value) || 'ten-game';
      var name = nameEl.value.trim() || 'Tên game';
      var ext = (extEl.value.trim() || '.png').replace(/^\.?/, '.');
      if (!ext.startsWith('.')) ext = '.' + ext;

      var html = [
        '<a class="game-item" href="game/' + slug + '.html">',
        '  <img loading="lazy" alt="' + slug + '" src="../assets/img/img-up/' + slug + ext + '"/>',
        '  <span>' + escapeHtml(name) + '</span>',
        '</a>'
      ].join('\n');

      outputEl.value = html;
    }

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    btnGenerate.addEventListener('click', function () {
      generate();
    });

    btnCopy.addEventListener('click', function () {
      generate();
      outputEl.select();
      document.execCommand('copy');
      btnCopy.textContent = 'Đã copy!';
      setTimeout(function () { btnCopy.textContent = 'Copy vào clipboard'; }, 1500);
    });

    slugEl.addEventListener('input', function () {
      if (!nameEl.value.trim() && slugEl.value) {
        var s = slugEl.value.replace(/-/g, ' ');
        nameEl.value = s.charAt(0).toUpperCase() + s.slice(1);
      }
    });
  </script>
</body>
</html>
