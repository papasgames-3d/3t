# Site settings
title: "Monkey Mart Blog"
description: "Stay updated with the latest news, guides, and updates about Monkey Mart and other popular online games."
url: "https://monkeymart.one"
baseurl: "/blog"

# Build settings
markdown: kramdown
plugins:
  - jekyll-paginate
  - jekyll-feed

# Exclude files
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - node_modules
  - package.json
  - package-lock.json

# Custom headers
webrick:
  headers:
    "Access-Control-Allow-Origin": "*"

# 404 page
defaults:
  - scope:
      path: "404.html"
    values:
      permalink: /404.html

# GitHub Pages settings
github:
  is_project_page: false

# Custom 404 page
defaults:
  - scope:
      path: "404.html"
    values:
      permalink: /404.html

# Exclude files from processing
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - server.js
  - server.py
  - package.json
  - package-lock.json
  - node_modules

# Cấu hình phân trang
paginate: 5
paginate_path: "/page:num/" 