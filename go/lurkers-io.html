<script>  
function openFullscreen() {  
    try {  
        const iframe = document.getElementById('game-iframe');  
        if (!iframe) {  
            console.error('Iframe not found');  
            return;  
        }  

        if (iframe.requestFullscreen) {  
            iframe.requestFullscreen();  
        } else if (iframe.webkitRequestFullscreen) {  
            iframe.webkitRequestFullscreen();  
        } else if (iframe.msRequestFullscreen) {  
            iframe.msRequestFullscreen();  
        } else if (iframe.mozRequestFullScreen) {  
            iframe.mozRequestFullScreen();  
        }  
    } catch (error) {  
        console.error('Error entering fullscreen:', error);  
    }  
}  

function shareOnFacebook() {  
    const url = encodeURIComponent(window.location.href);  
    const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;  
    window.open(shareUrl, '_blank', 'width=600,height=400');  
}  

function shareOnTwitter() {  
    const url = encodeURIComponent(window.location.href);  
    const text = encodeURIComponent('Check out this awesome game!');  
    const shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${text}`;  
    window.open(shareUrl, '_blank', 'width=600,height=400');  
}  

function shareOnPinterest() {  
    const url = encodeURIComponent(window.location.href);  
    const description = encodeURIComponent('Check out this awesome game!');  
    const shareUrl = `https://pinterest.com/pin/create/button/?url=${url}&description=${description}`;  
    window.open(shareUrl, '_blank', 'width=600,height=400');  
}  
</script>
