<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/><script async="" crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4151519079019358"></script>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Us - Monkey Mart</title>
<link href="assets/css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
<main class="main-content">
<section class="contact-section">
<h1>Contact Us</h1>
<div class="contact-content">
<div class="contact-info">
<h2>Get in Touch</h2>
<p>Have questions or feedback? We'd love to hear from you!</p>
<div class="contact-details">
<p><strong>Email:</strong> support@monkeymart.one</p>
<p><strong>Response Time:</strong> Within 24 hours</p>
</div>
</div>
<div class="contact-form">
<h2>Send us a Message</h2>
<form id="contactForm">
<div class="form-group">
<label for="name">Name:</label>
<input id="name" name="name" required="" type="text"/>
</div>
<div class="form-group">
<label for="email">Email:</label>
<input id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="subject">Subject:</label>
<input id="subject" name="subject" required="" type="text"/>
</div>
<div class="form-group">
<label for="message">Message:</label>
<textarea id="message" name="message" required=""></textarea>
</div>
<button class="submit-btn" type="submit">Send Message</button>
</form>
</div>
</div>
</section>
</main>
</div>
</body>
</html>
