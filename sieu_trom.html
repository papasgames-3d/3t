function removeBg(img,t=40){
  const oc=document.createElement("canvas");
  oc.width=img.naturalWidth;oc.height=img.naturalHeight;
  const ox=oc.getContext("2d");ox.drawImage(img,0,0);
  const d=ox.getImageData(0,0,oc.width,oc.height);
  for(let i=0;i<d.data.length;i+=4){
    if(d.data[i]<t&&d.data[i+1]<t&&d.data[i+2]<t)d.data[i+3]=0;
  }
  ox.putImageData(d,0,0);return oc;
}

const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type,vol){
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.15,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

function loadLevel(idx){
  const L=LEVELS[idx];

  coins=L.coins.map(c=>({...c,done:false}));

  stairs=L.stairs;
  player.x=80;

  detTimer=0;score=0;frameCount=0;
}

cv.addEventListener("click",e=>{
  if(AC.state==="suspended")AC.resume();
  if(detTimer>0)return;
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(gs==="menu"){
    // level buttons
    for(let i=0;i<LEVELS.length;i++){
      if(hit(mx,my,300,200+i*70,300,52)){levelIdx=i;loadLevel(i);gs="playing";}
    }
    if(hit(mx,my,320,420,260,44))showHelp=!showHelp;
  } else if(gs==="levelclear"){
    if(levelIdx<LEVELS.length-1){if(hit(mx,my,330,330,240,52)){levelIdx++;loadLevel(levelIdx);gs="playing";}}
    if(hit(mx,my,330,400,240,52)){gs="menu";}
  } else if(gs==="gameover"){
    if(hit(mx,my,330,310,240,52)){reset();gs="playing";}
    if(hit(mx,my,330,380,240,52)){gs="menu";}
  } else if(gs==="win"){
    if(hit(mx,my,330,400,240,52)){gs="menu";}
  }
});

function drawSprite(src,x,y,w,h,flipX){
  if(!src)return;
  cx.save();
  if(flipX){cx.translate(x+w,y);cx.scale(-1,1);cx.drawImage(src,0,0,w,h);}
  else cx.drawImage(src,x,y,w,h);
  cx.restore();
}

    ["#1c1410","#221a12","#261d13","#2a2014","#1a1208"],

  const pal=palettes[levelIdx%palettes.length];
  for(let fi=0;fi<=nFloors;fi++){
    const top=fi===0?0:(FY[fi-1]||H);

    rect(0,top,W,bot-top,pal[fi]||pal[pal.length-1]);
  }
  cx.strokeStyle="#0e0a06";cx.lineWidth=2;
  for(let x=60;x<W;x+=60){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}

    rect(0,y-PH,W,PH,"#4a3820");rect(0,y-PH,W,2,"#6a5030");rect(0,y-2,W,2,"#2a1c0c");
  });
  // stairs
  const stairDefs=LEVELS[levelIdx].stairs;
  stairDefs.forEach(s=>{
    const botY=FY[s.fi]-PH;
    const topY=(s.fi+1<FY.length?FY[s.fi+1]:140)-PH;
    drawStairs(s.x,botY,topY);
  });
  // props per level
  if(levelIdx===0){
    drawDoor(820,FY[0]-PH-110);drawCabinet(60,FY[0]-PH-80);drawRug(280,FY[0]-PH,200,12);drawBarrel(680,FY[0]-PH-50);
    drawWallLamp(500,FY[1]-PH-90,true);drawPainting(180,FY[1]-PH-100);drawChair(710,FY[1]-PH-50);

}

function drawStairs(x,botY,topY){
  const steps=6,sw=55,sh=Math.round((botY-topY)/steps);
  for(let i=0;i<steps;i++){
    const sy=botY-i*sh,sx=x+i*8;
    rect(sx,sy-sh,sw,sh,i%2===0?"#3e2e18":"#4a3820");strk(sx,sy-sh,sw,sh,"#1a0e04",1);
    rect(sx,sy-3,sw,3,"#5a4428");
  }
  cx.strokeStyle="#7a5a30";cx.lineWidth=3;cx.beginPath();cx.moveTo(x+2,botY-sh);
  for(let i=0;i<steps;i++)cx.lineTo(x+i*8+sw/2,(botY-i*sh)-sh+2);cx.stroke();
}

// ── COINS ────────────────────────────────────────────
function drawCoins(){
  const t=Date.now()/400;
  coins.forEach(c=>{
    if(c.done)return;
    const bob=Math.sin(t+c.x)*3;
    const grd=cx.createRadialGradient(c.x,c.y+bob,2,c.x,c.y+bob,11);
    grd.addColorStop(0,"#fff8c0");grd.addColorStop(0.4,"#ffd700");grd.addColorStop(1,"#b8860b");
    cx.fillStyle=grd;cx.beginPath();cx.arc(c.x,c.y+bob,11,0,Math.PI*2);cx.fill();
    txt("$",c.x,c.y+bob+1,"#7a5000",10,"center",true);
    // glow
    cx.fillStyle="rgba(255,215,0,0.15)";cx.beginPath();cx.arc(c.x,c.y+bob,16,0,Math.PI*2);cx.fill();
  });
}

// ── GUARD VISION CONE ────────────────────────────────
function drawGuardVision(g){
  if(g.mode==="straight"){
    const alert=g.alertFlash>0;
    cx.fillStyle=alert?"rgba(255,60,0,0.28)":"rgba(255,220,0,0.13)";
    if(g.dir>0)cx.fillRect(g.x+g.w,g.floorY-PH-g.h,g.vision,g.h);
    else cx.fillRect(g.x-g.vision,g.floorY-PH-g.h,g.vision,g.h);
  } else {
    // 360° cone
    const alert=g.alertFlash>0;
    const rad=g.radius;
    const angRad=g.angle*(Math.PI/180);
    const spread=50*(Math.PI/180); // ±50°
    const cx2=g.x+g.w/2, cy2=g.y+g.h/2;
    cx.fillStyle=alert?"rgba(255,60,0,0.3)":"rgba(255,220,0,0.18)";
    cx.beginPath();cx.moveTo(cx2,cy2);
    cx.arc(cx2,cy2,rad,angRad-spread,angRad+spread);
    cx.closePath();cx.fill();
    cx.strokeStyle=alert?"rgba(255,80,0,0.5)":"rgba(255,200,0,0.3)";
    cx.lineWidth=1;cx.stroke();
  }
}

// ── LOGIC ────────────────────────────────────────────
function movePlayer(){
  if(detTimer>0)return;
  let moved=false;
  if(keys["ArrowLeft"]){player.x-=player.speed;player.dir=-1;moved=true;}
  if(keys["ArrowRight"]){player.x+=player.speed;player.dir=1;moved=true;}
  if(keys["ArrowUp"]){player.y-=player.speed;moved=true;}
  if(keys["ArrowDown"]){player.y+=player.speed;moved=true;}
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  player.y=Math.max(0,Math.min(H-player.h,player.y));
  if(moved){stepFrame++;if(stepFrame%14===0)sfxStep();}
}

function updateGuards(){
  guards.forEach(g=>{
    if(g.alertFlash>0)g.alertFlash--;
    if(g.mode==="straight"){
      g.x+=g.dir*g.speed;
      if(g.x>g.maxX||g.x<g.minX)g.dir*=-1;
      g.y=g.floorY-PH-g.h;
    } else {
      // rotate in place
      g.angle=(g.angle+g.rotSpeed)%360;
      if(g.speed>0){
        g.x+=g.dir*g.speed;
        if(g.x>g.maxX||g.x<g.minX)g.dir*=-1;
      }
      g.y=g.floorY-PH-g.h;
    }
  });
}

function detectPlayer(){
  if(detTimer>0){detTimer--;if(detTimer===0)reset();return;}
  let caught=false;
  guards.forEach(g=>{
    if(caught)return;
    const px=player.x+player.w/2, py=player.y+player.h/2;
    if(g.mode==="straight"){
      const sameFloor=Math.abs((player.y+player.h)-(g.floorY-PH))<40;
      const seen=g.dir>0?(player.x>g.x+g.w&&player.x<g.x+g.w+g.vision):(player.x+player.w<g.x&&player.x+player.w>g.x-g.vision);
      if(sameFloor&&seen){caught=true;g.alertFlash=90;}
    } else {
      const gx=g.x+g.w/2, gy=g.y+g.h/2;
      const dx=px-gx, dy=py-gy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<g.radius){
        const angToPlayer=Math.atan2(dy,dx)*(180/Math.PI);
        let diff=Math.abs(angToPlayer-g.angle)%360;
        if(diff>180)diff=360-diff;
        if(diff<55){caught=true;g.alertFlash=90;}
      }
    }
  });
  if(caught&&detTimer===0){detTimer=90;sfxAlert();}
}

function collectCoins(){
  if(detTimer>0)return;
  coins.forEach(c=>{
    if(!c.done&&Math.abs(player.x+player.w/2-c.x)<26&&Math.abs(player.y+player.h/2-c.y)<26){
      c.done=true;score++;sfxCoin();
    }
  });
  if(coins.every(c=>c.done)&&gs==="playing"){
    // level clear!
    const secsUsed=Math.ceil((LEVELS[levelIdx].time*60-timeLeft)/60);
    const hs=highscores[levelIdx];
    if(!hs||secsUsed<hs){highscores[levelIdx]=secsUsed;localStorage.setItem("sieu_trom_hs",JSON.stringify(highscores));}
    if(levelIdx===LEVELS.length-1){gs="win";sfxWin();}
    else{gs="levelclear";sfxWin();}
  }
}

function updateTimer(){
  if(gs!=="playing"||detTimer>0)return;
  timeLeft--;
  if(timeLeft<=0){gs="gameover";sfxGameOver();}
}

// ── MAIN LOOP ────────────────────────────────────────
function loop(){
  cx.clearRect(0,0,W,H);
  frameCount++;
  if(gs==="menu"){drawMenu();}
  else if(gs==="levelclear"){drawLevelClear();}
  else if(gs==="gameover"){drawGameOver();}
  else if(gs==="win"){drawWinScreen();}
  else if(gs==="playing"){
    movePlayer();updateGuards();detectPlayer();collectCoins();updateTimer();
    drawScene();drawCoins();
    guards.forEach(g=>{drawGuardVision(g);drawGuardSprite(g);});
    drawPlayerSprite();
    drawHUD();
  }
  requestAnimationFrame(loop);
}
loop();
